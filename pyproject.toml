[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project]
name = "soc2-content-agent"
version = "1.0.0"
description = "SOC 2-ready Marketing Content Writer Agent (PII proxy, tenant-isolated RAG, versioned prompts, human review gate, WORM audit trail)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "anthropic>=1.0",
    "python-jose[cryptography]>=3.3",
    "boto3>=1.34",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "pyyaml>=6.0",
    "markdown>=3.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: `Depends(...)` in parameter defaults is the FastAPI dependency-injection idiom.
ignore = ["B008"]
