# Structured source for the control mapping shown in the Governance workspace.
# SOC2_CONTROL_MATRIX.md is the narrative/auditor view; this file is what the application reads.
# A test asserts that every id here appears in the matrix and vice versa.
#
# status:  implemented | partial | planned | unverified
#   implemented - control exists in code/config AND an automated test or CI step exercises it
#   partial     - control exists but a documented part is missing or environment-dependent
#   planned     - documented, not yet built
#   unverified  - exists but nothing currently exercises it
# evidence: where an auditor finds proof it operated (tests, audit event types, CI steps, files)
disclaimer: >
  Statuses describe implementation and automated verification inside this repository. They are
  not an assertion of operating effectiveness over a period and do not constitute a SOC 2 report.

controls:
  - id: C-01
    title: Single model gateway; no direct provider calls from UI or CMS
    criteria: [CC6.6, CC6.7]
    status: implemented
    evidence: [app/llm.py is the only provider import, infra/network/egress_allowlist.md]
  - id: C-02
    title: PII, secrets and tenant-confidential terms redacted before leaving the boundary
    criteria: [C1.1, C1.2, P3.1, P6.1]
    status: implemented
    evidence: [tests/test_redaction.py, test_pii_never_reaches_the_model, audit GENERATION.redaction.counts]
  - id: C-03
    title: Model provider under zero-data-retention terms; non-ZDR providers refused in prod
    criteria: [CC9.2, C1.1]
    status: partial
    evidence: [Settings.validate_for_environment, test_free_tier_provider_is_refused_in_prod, audit CONFIG.data_retention_class]
    gap: Learning deployment runs a free-tier provider without ZDR terms (accepted for public, non-client content only).
    owner: platform-security
  - id: C-04
    title: Knowledge base accessed via SELECT-only role in read-only transactions
    criteria: [CC6.1, CC6.3]
    status: unverified
    evidence: [app/rag.py PgVectorRetriever._assert_read_only, infra/iam/rag_readonly_role.sql]
    gap: Startup check exists but current deployments use the in-memory retriever; not exercised against Postgres.
    owner: platform-infra
  - id: C-05
    title: Tenant isolation for retrieval, reads and lists
    criteria: [CC6.1, C1.1]
    status: implemented
    evidence: [test_tenant_isolation_in_rag_and_reads, workflow.load_owned]
  - id: C-06
    title: Prompts versioned in Git with SHA-256 manifest; runtime refuses mismatches
    criteria: [CC8.1]
    status: implemented
    evidence: [tests/test_prompt_registry.py, CI manifest check, .github/CODEOWNERS]
  - id: C-07
    title: Model pinned in config; served model recorded per request
    criteria: [CC8.1, PI1.2]
    status: implemented
    evidence: [audit GENERATION.model_requested/model_served, compliance/MODEL_REGISTRY.md]
  - id: C-08
    title: Prompt-injection controls on retrieved content with regression test set
    criteria: [CC7.1, PI1.2]
    status: implemented
    evidence: [tests/test_injection.py, prompts/*/injection_guard.md]
  - id: C-09
    title: Human review gate with segregation of duties and verification note before publish
    criteria: [PI1.4, PI1.5, CC6.3]
    status: implemented
    evidence: [test_agent_cannot_publish_without_human_approval, audit REVIEW/PUBLISH]
  - id: C-10
    title: Output screening for risky claims, unsourced statistics, hallucinated URLs
    criteria: [PI1.2, PI1.3]
    status: implemented
    evidence: [app/injection.py screen_output, draft.review_flags]
  - id: C-11
    title: Hash-chained audit records streamed to write-once storage
    criteria: [CC7.2, CC7.3, CC4.1]
    status: partial
    evidence: [app/audit.py, test_audit_chain_records_full_lineage_and_is_tamper_evident, infra/iam/audit_bucket.tf]
    gap: Object Lock bucket is defined in Terraform but not provisioned for this deployment; the local mirror is the only copy.
    owner: platform-infra
  - id: C-12
    title: Audit log holds hashes of redacted inputs, never raw personal data
    criteria: [C1.1, P3.2]
    status: implemented
    evidence: [test_audit_chain_records_full_lineage_and_is_tamper_evident asserts no PII]
  - id: C-13
